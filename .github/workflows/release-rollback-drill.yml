name: Release Rollback Drill

on:
  workflow_dispatch:
    inputs:
      previous_release_tag:
        description: "上一正式可用 Release tag（例如 v0.2.10）"
        required: true
        type: string
      candidate_version:
        description: "当前 main 候选版本（不含 v）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-rollback-drill-${{ github.sha }}
  cancel-in-progress: false

jobs:
  agentd-binary-rollback:
    if: github.repository == 'gaixianggeng/codex-ipad-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted main candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Trust gate and resolve previous release
        id: refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ inputs.previous_release_tag }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREVIOUS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "v$CANDIDATE_VERSION" != "$PREVIOUS_TAG" ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          git fetch --force origin "refs/tags/$PREVIOUS_TAG:refs/tags/$PREVIOUS_TAG"
          previous_sha="$(git rev-parse "$PREVIOUS_TAG^{commit}")"
          git merge-base --is-ancestor "$previous_sha" "$GITHUB_SHA"
          release_json="$RUNNER_TEMP/previous-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PREVIOUS_TAG" >"$release_json"
          ruby -rjson -e '
            release = JSON.parse(File.read(ARGV.fetch(0)))
            abort "previous release draft/prerelease" if release.fetch("draft") || release.fetch("prerelease")
            abort "previous tag mismatch" unless release.fetch("tag_name") == ENV.fetch("PREVIOUS_TAG")
          ' "$release_json"
          previous_version="${PREVIOUS_TAG#v}"
          echo "previous_sha=$previous_sha" >>"$GITHUB_OUTPUT"
          echo "previous_version=$previous_version" >>"$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install pinned Codex CLI
        run: npm install --global "@openai/codex@$(cat internal/httpapi/testdata/codex-protocol/codex-version.txt)"

      - name: Build candidate and download previous release binary
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ inputs.previous_release_tag }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rollback/candidate" "$RUNNER_TEMP/rollback/previous"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=$CANDIDATE_VERSION -X main.buildCommit=$GITHUB_SHA" \
            -o "$RUNNER_TEMP/rollback/candidate/agentd" ./cmd/agentd
          archive="mimi-remote_${PREVIOUS_TAG#v}_linux_amd64.tar.gz"
          gh release download "$PREVIOUS_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" \
            --pattern checksums.txt \
            --dir "$RUNNER_TEMP/rollback/previous"
          cd "$RUNNER_TEMP/rollback/previous"
          expected_sha="$(awk -v name="$archive" '$2 == name {print $1}' checksums.txt)"
          [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]]
          echo "$expected_sha  $archive" | sha256sum --check --strict
          tar -xzf "$archive"
          chmod 0755 agentd
          echo "asset_sha256=$expected_sha" >>"$GITHUB_OUTPUT"
          echo "asset_url=https://github.com/$GITHUB_REPOSITORY/releases/download/$PREVIOUS_TAG/$archive" >>"$GITHUB_OUTPUT"

      - name: Execute in-place candidate to previous rollback
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          PREVIOUS_TAG: ${{ inputs.previous_release_tag }}
          PREVIOUS_SHA: ${{ steps.refs.outputs.previous_sha }}
          PREVIOUS_VERSION: ${{ steps.refs.outputs.previous_version }}
          PREVIOUS_ASSET_SHA256: ${{ steps.artifact.outputs.asset_sha256 }}
          PREVIOUS_ASSET_URL: ${{ steps.artifact.outputs.asset_url }}
        run: |
          mkdir -p "$RUNNER_TEMP/rollback/evidence"
          bash ./scripts/run-agentd-rollback-drill.sh \
            --candidate-binary "$RUNNER_TEMP/rollback/candidate/agentd" \
            --previous-binary "$RUNNER_TEMP/rollback/previous/agentd" \
            --candidate-sha "$GITHUB_SHA" \
            --candidate-version "$CANDIDATE_VERSION" \
            --previous-sha "$PREVIOUS_SHA" \
            --previous-version "$PREVIOUS_VERSION" \
            --previous-tag "$PREVIOUS_TAG" \
            --previous-asset-url "$PREVIOUS_ASSET_URL" \
            --previous-asset-sha256 "$PREVIOUS_ASSET_SHA256" \
            --platform linux-amd64 \
            --output "$RUNNER_TEMP/rollback/evidence/rollback-drill.json"

      - name: Add trusted workflow provenance
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/rollback/evidence/rollback-drill.json"
          export GITHUB_RUN_ID GITHUB_RUN_ATTEMPT GITHUB_REPOSITORY GITHUB_SHA GITHUB_EVENT_NAME
          ruby -rjson -rtime -e '
            path = ARGV.fetch(0)
            evidence = JSON.parse(File.read(path))
            evidence["source_run"] = {
              "repository" => ENV.fetch("GITHUB_REPOSITORY"),
              "workflow_path" => ".github/workflows/release-rollback-drill.yml",
              "run_id" => ENV.fetch("GITHUB_RUN_ID"),
              "run_attempt" => Integer(ENV.fetch("GITHUB_RUN_ATTEMPT"), 10),
              "event" => ENV.fetch("GITHUB_EVENT_NAME"),
              "head_sha" => ENV.fetch("GITHUB_SHA")
            }
            File.write(path, JSON.generate(evidence) + "\n", mode: "w", perm: 0o600)
          ' "$evidence"

      - name: Upload rollback evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rollback-drill-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/rollback/evidence/rollback-drill.json
          if-no-files-found: error
          retention-days: 30
